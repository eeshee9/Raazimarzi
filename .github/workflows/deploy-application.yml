name: Deploy Application

on:
  push:
    branches: [main]
    paths:
      - 'application/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Application to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /var/www/raazimarzi

            cd application

            # Clean previous build so stale bundles can never survive a failed build
            rm -rf build

            npm install

            # GENERATE_SOURCEMAP=false cuts peak memory from ~3 GB to ~800 MB.
            # Without it, react-scripts 5 + react@19 exhausts RAM on small VPS
            # instances — the build process is killed mid-way, no build/ is produced.
            GENERATE_SOURCEMAP=false npm run build

            # Verify the build produced a real output, not the default CRA boilerplate
            if [ ! -f build/index.html ]; then
              echo "BUILD FAILED: build/index.html missing"
              exit 1
            fi
            if grep -q ">React App<" build/index.html; then
              echo "BUILD FAILED: title is still default CRA boilerplate"
              exit 1
            fi

            # Reload nginx (no nginx -t here — config isn't changed by this workflow;
            # nginx -t may not be in sudoers and is unnecessary when config is unchanged)
            sudo systemctl reload nginx
            echo "Application deployed successfully"
