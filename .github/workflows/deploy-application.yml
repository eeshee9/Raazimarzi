name: Deploy Application

on:
  push:
    branches: [main]
    paths:
      - 'application/**'
  workflow_dispatch:   # allow manual re-deploy without a code change

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Application to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /var/www/raazimarzi
            git fetch --all
            git reset --hard origin/main

            cd application

            # Hard-clean the previous build so stale bundles cannot survive a
            # partial or failed build. react-scripts build also does this, but
            # explicit removal ensures we start clean even if the tool changes.
            rm -rf build

            npm install --legacy-peer-deps
            npm run build

            # --- Build verification ---
            # Confirm the output looks like a real RaaziMarzi build, not the
            # old default CRA boilerplate (<title>React App</title>).
            if [ ! -f build/index.html ]; then
              echo "❌ BUILD FAILED: build/index.html does not exist after npm run build"
              exit 1
            fi
            if grep -q "React App" build/index.html; then
              echo "❌ BUILD VERIFICATION FAILED: built index.html still has default CRA title."
              echo "   Check application/public/index.html has the correct <title> tag."
              exit 1
            fi

            BUILT_TITLE=$(grep -o '<title>[^<]*</title>' build/index.html || echo "(no title tag)")
            BUILT_BUNDLE=$(ls build/static/js/main.*.js 2>/dev/null | head -1 || echo "NO BUNDLE FOUND")
            echo "✅ Build verified"
            echo "   title:  $BUILT_TITLE"
            echo "   bundle: $BUILT_BUNDLE"

            # Test nginx config before reloading to prevent downtime from a bad config
            sudo nginx -t
            sudo systemctl reload nginx
            echo "✅ Application deployed"
