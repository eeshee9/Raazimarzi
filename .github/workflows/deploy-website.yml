name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Website to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /var/www/raazimarzi
            
            cd website
            npm install
            npm run build

            # Wipe before copy — guards against nested-dir bug if the directory
            # somehow persists; next build recreates .next/ fresh, but rm is defensive
            rm -rf .next/standalone/.next/static
            cp -r .next/static .next/standalone/.next/static

            # Always wipe and recreate standalone/public so repeated deploys never
            # create the nested-directory bug (cp -r src dst when dst exists copies
            # src INTO dst instead of replacing its contents).
            rm -rf .next/standalone/public
            mkdir -p .next/standalone/public
            cp -r public/. .next/standalone/public/

            # All favicon assets live in application/public (committed).
            # website/public contains no favicons — copy all three from application.
            cp /var/www/raazimarzi/application/public/favicon.ico        .next/standalone/public/favicon.ico
            cp /var/www/raazimarzi/application/public/favicon.svg        .next/standalone/public/favicon.svg
            cp /var/www/raazimarzi/application/public/apple-touch-icon.png .next/standalone/public/apple-touch-icon.png

            # Inject stable Server Action encryption key so the encryption does not
            # rotate on every PM2 reload. Without this, each restart generates a new
            # random key; browsers with cached pages then send action IDs encrypted
            # with the old key and get "Failed to find Server Action" errors.
            # Secret must be 64 hex chars — generate with: openssl rand -hex 32
            ACTIONS_KEY="${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}"
            [ -n "$ACTIONS_KEY" ] && export NEXT_SERVER_ACTIONS_ENCRYPTION_KEY="$ACTIONS_KEY"

            # Reload with updated env so the key reaches the live process
            pm2 reload website --update-env 2>/dev/null \
              || pm2 start /var/www/raazimarzi/website/.next/standalone/server.js \
                   --name website \
                   --cwd /var/www/raazimarzi/website
            pm2 save 2>/dev/null || true
            echo "Website deployed successfully"
