name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Website to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /var/www/raazimarzi
            git fetch --all
            git reset --hard origin/main

            cd website
            npm install
            npm run build

            # Copy static chunks into standalone output (Next.js standalone requirement)
            cp -r .next/static .next/standalone/.next/static

            # Always wipe and recreate standalone/public so repeated deploys never
            # create the nested-directory bug (cp -r src dst when dst exists copies
            # src INTO dst instead of replacing its contents).
            rm -rf .next/standalone/public
            mkdir -p .next/standalone/public
            cp -r public/. .next/standalone/public/

            # website/public/favicon.ico is not committed (binary).
            # application/public/favicon.ico is tracked and always present after git reset.
            cp /var/www/raazimarzi/application/public/favicon.ico .next/standalone/public/favicon.ico

            # Reload (zero-downtime) if pm2 process exists, otherwise start fresh
            pm2 reload website 2>/dev/null \
              || pm2 start /var/www/raazimarzi/website/.next/standalone/server.js \
                   --name website \
                   --cwd /var/www/raazimarzi/website
            echo "Website deployed successfully"
