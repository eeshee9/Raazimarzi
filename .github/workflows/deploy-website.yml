name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
  workflow_dispatch:   # allow manual re-deploy without a code change

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Website to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /var/www/raazimarzi
            git fetch --all
            git reset --hard origin/main

            cd website
            npm install
            npm run build

            # Next.js standalone requires manual copy of static chunks and public assets
            cp -r .next/static .next/standalone/.next/static
            cp -r public .next/standalone/public

            # website/public does not contain favicon.ico (binary, not committed).
            # application/public/favicon.ico is tracked in git and always present
            # after git reset. Copy it so /favicon.ico resolves on the website too.
            cp /var/www/raazimarzi/application/public/favicon.ico .next/standalone/public/favicon.ico

            pm2 restart website || pm2 start .next/standalone/server.js --name website
            echo "✅ Website deployed"
