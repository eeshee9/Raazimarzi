<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Brand purple background with rounded corners -->
  <rect width="32" height="32" rx="6" fill="#4F3CC9"/>

  <!-- Three-person silhouette mark — simplified to read at 16×16 -->
  <!-- Left figure -->
  <circle cx="8.5" cy="8.5" r="2.5" fill="white"/>
  <path d="M5 22 C5 17.5 7 15.5 8.5 14 C10 15.5 12 17.5 12 22 Z" fill="white"/>

  <!-- Centre figure (taller) -->
  <circle cx="16" cy="7.5" r="2.5" fill="white"/>
  <path d="M12.5 22 C12.5 16.5 14.5 14 16 12.5 C17.5 14 19.5 16.5 19.5 22 Z" fill="white"/>

  <!-- Right figure -->
  <circle cx="23.5" cy="8.5" r="2.5" fill="white"/>
  <path d="M20 22 C20 17.5 22 15.5 23.5 14 C25 15.5 27 17.5 27 22 Z" fill="white"/>

  <!-- Connecting arc under feet -->
  <path d="M5 22 Q16 25 27 22" stroke="white" stroke-width="1.2" fill="none" stroke-linecap="round"/>
</svg>
