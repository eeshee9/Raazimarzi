# /etc/nginx/sites-available/raazimarzi
# Install: sudo cp config/nginx-raazimarzi.conf /etc/nginx/sites-available/raazimarzi
#          sudo ln -sf /etc/nginx/sites-available/raazimarzi /etc/nginx/sites-enabled/raazimarzi
#          sudo nginx -t && sudo systemctl reload nginx
#
# Serving layout:
#   /         → Next.js website  (PM2, port 3000)
#   /app/*    → CRA React app    (nginx static alias to application/build/)
#   /api/*    → Express backend  (PM2, port 5000)

server {
    listen 80;
    server_name raazimarzi.com;

    # ── CRA React application (static build) ──────────────────────
    # CRITICAL: alias points to application/BUILD, not application/ root.

    # index.html must never be cached — bundle hash references change on every deploy.
    location = /app/index.html {
        alias /var/www/raazimarzi/application/build/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Hashed static bundles can be cached indefinitely (filename contains content hash).
    # Using regex + alias capture group — avoids the alias/root conflict.
    location ~* ^/app/static/(.*)$ {
        alias /var/www/raazimarzi/application/build/static/$1;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires max;
    }

    # SPA catch-all: serve files from build dir; unknown paths fall back to
    # index.html so React Router handles client-side navigation.
    location /app {
        alias /var/www/raazimarzi/application/build;
        try_files $uri $uri/ /app/index.html;
    }

    # ── Express backend API ────────────────────────────────────────
    location /api {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Next.js website (catch-all, must be last) ─────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}

# Redirect www → non-www
server {
    listen 80;
    server_name www.raazimarzi.com;
    return 301 $scheme://raazimarzi.com$request_uri;
}
